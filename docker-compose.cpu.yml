version: "3.8"

services:
  sunny-narrator:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: sunny-narrator:cpu
    container_name: sunny-narrator-cpu
    env_file:
      - .env
    volumes:
      - ./books:/app/books:ro
      - ./output:/app/output
      # Optional: mount .env for runtime changes
      # - ./.env:/app/.env:ro
    environment:
      # Force CPU mode
      - GPU=false
      - NER=true
    # No GPU resources needed
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    stdin_open: true
    tty: true
    restart: unless-stopped
    # Uncomment for debugging
    # command: ["bash"]

# Notes:
# - This compose file is for CPU-only systems
# - NER will run on CPU (slower but works everywhere)
# - For GPU support, use docker-compose.gpu.yml instead
#
# Usage:
#   docker-compose -f docker-compose.cpu.yml up -d
#   docker-compose -f docker-compose.cpu.yml logs -f
#   docker-compose -f docker-compose.cpu.yml down
