services:
  sunny-narrator:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    image: sunny-narrator:cpu
    container_name: sunny-narrator-cpu
    env_file:
      - .env
    volumes:
      # read-write: the translation and its checkpoint are written next to the book
      - ./books:/app/books
      - ./output:/app/output
      - ./logs:/app/logs
      # Optional: mount .env for runtime changes
      # - ./.env:/app/.env:ro
    environment:
      - NER=true
    # No GPU resources needed
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    stdin_open: true
    tty: true
    # a translation is a command, not a service: no restart when it is done
    restart: "no"
    # Uncomment for debugging
    # command: ["bash"]

# Notes:
# - This compose file is for CPU-only systems
# - NER will run on CPU (slower but works everywhere)
# - For GPU support, use docker-compose.yml instead
#
# Usage (docs/DOCKER.md):
#   docker compose -f docker-compose.cpu.yml run --rm sunny-narrator
