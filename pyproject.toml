[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sunny-narrator"
version = "2.1"
description = "AI-powered book translation tool (FB2/EPUB/TXT/DOCX/PDF)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Core
    "nltk==3.9.4",
    "icecream==2.1.10",
    "python-dotenv==1.2.2",
    "openai==2.30.0",
    "numpy==2.2.6",
    "tiktoken==0.12.0",
    "langchain-text-splitters==1.1.1",
    "pydantic==2.12.5",
    "beautifulsoup4==4.14.3",
    "scikit-learn==1.7.2",
    # >=4.9.3 is the first release shipping cp312 wheels; the old ==4.8.0
    # pin forced a source build (and a libxml2/libxslt toolchain) on any
    # Python newer than 3.11.
    "lxml>=4.9.3",
    "more-itertools==8.10.0",
    "joblib==1.5.3",
    "EbookLib==0.20",
    "Pillow==12.3.0",
    "pypandoc==1.17",
    # NER / spaCy. src/ner.py imports spacy and torch unconditionally, so both
    # belong in the base set; the CUDA-specific builds live in the [gpu] extra
    # below. Plain PyPI wheels here, because a pinned CUDA wheel URL is
    # interpreter-specific and makes the whole project uninstallable on any
    # other Python -- which is exactly what used to happen (see [gpu]).
    "spacy==3.8.13",
    "thinc==8.3.13",
    "torch>=2.5.1",
    # Encoding detection
    "charset-normalizer==3.4.6",
    "chardet==4.0.0",
]

[project.optional-dependencies]
# GPU acceleration for NER and cosine similarity. torch is deliberately NOT
# pinned here to a download.pytorch.org wheel URL any more: that pin named a
# cp311 build, so pip rejected the whole project on every other interpreter
# and `pip install -e .` could not succeed at all on Python 3.12. The default
# PyPI torch wheels for Linux already bundle a CUDA 12.x runtime, so the base
# "torch>=2.5.1" covers the GPU case and only cupy stays CUDA-specific.
gpu = [
    "spacy[cuda12x]==3.8.13",
    "cupy-cuda12x==14.1.1",
]
dev = [
    "pytest",
    "pytest-timeout",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
# test_calibre_cleanup.py contains zero test functions; it is a manual-check
# script that runs an `ebook-convert` conversion at module import time
# (pytest collection). Ignored so the suite runs without a calibre install.
addopts = "--ignore=tests/test_calibre_cleanup.py"

[tool.setuptools.packages.find]
include = ["src*"]

[project.scripts]
sunny-narrator = "app:main"
