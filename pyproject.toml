[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sunny-narrator"
version = "2.12.0"
description = "AI-powered book translation tool (FB2/EPUB/TXT/DOCX/PDF)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Core
    "nltk==3.9.4",
    "icecream==2.1.10",
    "python-dotenv==1.2.2",
    "openai==2.30.0",
    # imported directly by src/utils.py (also an openai dependency)
    "httpx==0.28.1",
    "numpy==2.2.6",
    "tiktoken==0.12.0",
    "langchain-text-splitters==1.1.1",
    "pydantic==2.12.5",
    "beautifulsoup4==4.14.3",
    "scikit-learn==1.7.2",
    # >=4.9.3 is the first release shipping cp312 wheels; the old ==4.8.0
    # pin forced a source build (and a libxml2/libxslt toolchain) on any
    # Python newer than 3.11.
    "lxml>=4.9.3",
    "more-itertools==8.10.0",
    "joblib==1.5.3",
    "EbookLib==0.20",
    "Pillow==12.3.0",
    "pypandoc==1.17",
    # NER / spaCy. No torch: the *_sm/*_lg pipelines run on thinc (NumPy, or
    # CuPy with the [gpu] extra); torch was only asked whether CUDA is there,
    # and its default Linux wheel pulled about 3 GB of CUDA libraries into
    # every install, a cloud one without a GPU too.
    "spacy==3.8.13",
    "thinc==8.3.13",
    # Encoding detection
    "charset-normalizer==3.4.6",
    "chardet==4.0.0",
]

[project.optional-dependencies]
# GPU acceleration for NER and cosine similarity: CuPy only - spaCy uses
# whichever cupy is importable, and ner.gpu_available() asks CuPy for a device.
# The spacy[cuda12x] extra is deliberately NOT used: spaCy 3.8.13 caps it at
# cupy-cuda12x<13, which cannot be satisfied together with the pinned
# cupy 14.1.1 (pip: ResolutionImpossible, the Docker build failed on it).
# spaCy is already in the base set and picks up whichever cupy is importable.
gpu = [
    "cupy-cuda12x==14.1.1",
]
# Tokenizers that the Japanese and Chinese spaCy models need
# (`python -m spacy download ja_core_news_lg zh_core_web_lg`). Korean
# (ko_core_news_lg) uses spaCy's own tokenizer and needs nothing extra.
cjk = [
    "sudachipy==0.7.0",
    "sudachidict-core==20260723.1",
    "spacy-pkuseg==1.0.1",
]
dev = [
    "pytest",
    "pytest-timeout",
    "pytest-cov",
    # Same version as .github/workflows/ruff.yml: a newer ruff has other rules.
    "ruff==0.4.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
# test_calibre_cleanup.py contains zero test functions; it is a manual-check
# script that runs an `ebook-convert` conversion at module import time
# (pytest collection). Ignored so the suite runs without a calibre install.
addopts = "--ignore=tests/test_calibre_cleanup.py"

[tool.setuptools]
# app.py is the entry point module (console script sunny-narrator = app:cli)
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["src*"]

[project.scripts]
sunny-narrator = "app:cli"
