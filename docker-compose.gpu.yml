version: "3.8"

services:
  sunny-narrator:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: sunny-narrator:gpu
    container_name: sunny-narrator-gpu
    env_file:
      - .env
    volumes:
      - ./books:/app/books:ro
      - ./output:/app/output
      - ./.env:/app/.env:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stdin_open: true
    tty: true
    # Uncomment for debugging
    # command: ["bash"]

