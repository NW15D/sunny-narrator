services:
  sunny-narrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: sunny-narrator:latest
    container_name: sunny-narrator
    env_file:
      - .env
    volumes:
      - ./books:/app/books
      - ./src/prompts.json:/app/src/prompts.json
      # Optional: mount .env if you want to change it without rebuilding
      # - .env:/app/.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
