name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Dummy API keys: src.utils.LLMService instantiates openai clients at
    # __init__ and the openai SDK rejects empty keys. No real calls are made
    # (all LLM traffic is mocked in the unit tests).
    env:
      API_KEY_TRANSLATE: ci-dummy-key
      API_KEY_PROOFREAD: ci-dummy-key
      API_KEY_IMAGES: ci-dummy-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The pandoc *binary* is NOT guaranteed on ubuntu-latest; tests call
      # pypandoc.convert_text for real (test_toc_feature, test_feature_parity).
      - name: Install pandoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch first (src.ner imports torch at module level; no CUDA needed)
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          # Pinned project deps + dev extras (pytest, pytest-timeout, pytest-cov),
          # same as .gitlab-ci.yml.
          python -m pip install -e '.[dev]'

      - name: Run tests
        run: python -m pytest tests/ -q
